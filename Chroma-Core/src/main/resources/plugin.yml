name: Chroma-Core
main: buttondevteam.core.MainPlugin
version: '${version}'
author: NorbiPeti
commands:
  updateplugin:
    description: Update a TBMC plugin
  schrestart:
    description: Schedules a restart for a given time.
  primerestart:
    description: Restarts the server as soon as nobody is online.
  component:
    description: Enable or disable or list components
  dontrunthiscmd:
depend:
  - Vault
softdepend:
  - Towny
  - Votifier
  - Multiverse-Core
  - Essentials
api-version: '1.13'
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.4.21
  - me.lucko:commodore:2.2
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.11.0
  - com.github.shynixn.mccoroutine:mccoroutine-bukkit-api:2.23.0
  - com.github.shynixn.mccoroutine:mccoroutine-bukkit-core:2.23.0